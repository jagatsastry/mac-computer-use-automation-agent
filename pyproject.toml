[project]
name = "automation-agent"
version = "0.1.0"
description = "macOS Desktop Automation Agent with Vision and LLM capabilities"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Jagat Patel" }
]
keywords = ["automation", "macos", "ai", "agent", "desktop"]

dependencies = [
    # Core automation
    "pyautogui>=0.9.54",
    "pillow>=10.2.0",
    "opencv-python-headless>=4.9.0",
    "pytesseract>=0.3.10",
    "pynput>=1.7.6",

    # macOS specific
    "pyobjc-core>=10.1",
    "pyobjc-framework-Cocoa>=10.1",
    "pyobjc-framework-Quartz>=10.1",
    "pync>=2.0.3",

    # LLM
    "ollama>=0.1.6",

    # Configuration
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # Logging
    "structlog>=24.1.0",
    "colorama>=0.4.6",

    # HTTP client (for Hammerspoon bridge)
    "httpx>=0.27.0",

    # Utilities
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
anthropic = [
    "anthropic>=0.40.0",
]
gemini = [
    "google-genai>=1.0.0",
]
molmo = [
    "transformers>=4.46.0,<4.47.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "einops>=0.8.0",
    "accelerate>=1.10.0",
]
embeddings = [
    "fastembed>=0.3",
]
all = [
    "automation-agent[dev,anthropic,gemini,molmo,embeddings]",
]

[project.scripts]
automation-agent = "automation_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automation_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, all dependencies mocked)",
    "integration: Integration tests (may use real local services)",
    "e2e: End-to-end tests (real everything, requires macOS desktop)",
    "manual: Manual/interactive tests (require human observation)",
    "legacy: Tests for the old actions/ package (retained until removal)",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
