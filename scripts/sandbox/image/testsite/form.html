<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Contact Form</title>
<style>
  body { font-family: "DejaVu Sans", sans-serif; background: #f4f6f8; margin: 0; }
  header { background: #1a3c6e; color: white; padding: 24px 40px; }
  h1 { margin: 0; font-size: 32px; }
  main { padding: 40px; }
  .field { margin-bottom: 22px; max-width: 600px; }
  label { display: block; font-size: 18px; font-weight: bold; margin-bottom: 6px; color: #1a3c6e; }
  input, textarea { width: 100%; font-size: 20px; padding: 12px; border: 2px solid #8fa3bd;
                    border-radius: 8px; box-sizing: border-box; }
  button { font-size: 22px; padding: 14px 36px; background: #2e7d32; color: white;
           border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<header><h1>Contact Form</h1></header>
<main>
  <form action="/thanks.html" method="get">
    <div class="field">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name">
    </div>
    <div class="field">
      <label for="email">Email Address</label>
      <input type="text" id="email" name="email">
    </div>
    <button type="submit" id="send-btn">Send Message</button>
  </form>
</main>
</body>
</html>
