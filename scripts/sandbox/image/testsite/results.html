<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Search Results</title>
<style>
  body { font-family: "DejaVu Sans", sans-serif; background: #f4f6f8; margin: 0; }
  header { background: #1a3c6e; color: white; padding: 24px 40px; }
  h1 { margin: 0; font-size: 32px; }
  main { padding: 40px; }
  .result { background: white; border: 1px solid #c7d0dc; border-radius: 8px;
            padding: 20px; margin-bottom: 16px; max-width: 700px; }
  .result h2 { margin: 0 0 6px 0; font-size: 22px; color: #1a3c6e; }
  #query-echo { font-size: 20px; color: #2e7d32; font-weight: bold; }
</style>
</head>
<body>
<header><h1>Search Results</h1></header>
<main>
  <p id="query-echo"></p>
  <div id="results"></div>
</main>
<script>
  const q = new URLSearchParams(window.location.search).get("q") || "";
  document.getElementById("query-echo").textContent =
      q ? `Results for: ${q}` : "No search term given";
  const container = document.getElementById("results");
  if (q) {
    for (let i = 1; i <= 3; i++) {
      const div = document.createElement("div");
      div.className = "result";
      div.innerHTML = `<h2>${q} — item ${i}</h2><p>Quality ${q} available now. In stock.</p>`;
      container.appendChild(div);
    }
  }
</script>
</body>
</html>
