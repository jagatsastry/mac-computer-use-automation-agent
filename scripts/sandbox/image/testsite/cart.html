<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Your Cart</title>
<style>
  body { font-family: "DejaVu Sans", sans-serif; background: #f4f6f8; margin: 0; }
  header { background: #1a3c6e; color: white; padding: 24px 40px; }
  h1 { margin: 0; font-size: 32px; }
  main { padding: 40px; font-size: 22px; }
  li { margin-bottom: 10px; }
</style>
</head>
<body>
<header><h1>Your Cart</h1></header>
<main>
  <p id="summary"></p>
  <ul id="items"></ul>
</main>
<script>
  const items = JSON.parse(localStorage.getItem("cart") || "[]");
  document.getElementById("summary").textContent =
      items.length ? `You have ${items.length} item(s) in your cart.` : "Your cart is empty.";
  const ul = document.getElementById("items");
  items.forEach(it => { const li = document.createElement("li"); li.textContent = it; ul.appendChild(li); });
</script>
</body>
</html>
