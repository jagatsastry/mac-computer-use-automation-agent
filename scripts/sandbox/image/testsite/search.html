<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Product Search</title>
<style>
  body { font-family: "DejaVu Sans", sans-serif; background: #f4f6f8; margin: 0; }
  header { background: #1a3c6e; color: white; padding: 24px 40px; }
  h1 { margin: 0; font-size: 32px; }
  main { padding: 40px; }
  form { display: flex; gap: 16px; max-width: 700px; }
  input[type=text] { flex: 1; font-size: 22px; padding: 14px; border: 2px solid #8fa3bd;
                     border-radius: 8px; }
  button { font-size: 22px; padding: 14px 36px; background: #2e7d32; color: white;
           border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<header><h1>Product Search</h1></header>
<main>
  <p style="font-size:18px">Type a search term and press the Search button.</p>
  <form action="/results.html" method="get">
    <input type="text" id="q" name="q" placeholder="Search products...">
    <button type="submit" id="search-btn">Search</button>
  </form>
</main>
</body>
</html>
